name: APK bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK
        env:
          # Rendert nebenbei die gemalten Typ-Motive als Bilder (Artefakt "vorschau").
          PREVIEW: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: APK als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: cardscanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Vorschaubilder der Motive
        uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: app/build/previews/*.png
          if-no-files-found: ignore

      - name: TEMP Vorschau in Branch
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app/build/previews
          git init -q && git checkout -q -b vorschau-bilder && git add . 
          git -c user.name=ci -c user.email=ci@example.com commit -qm previews
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" vorschau-bilder

      - name: Release "latest" aktualisieren
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cardscanner.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest Cardscanner.apk \
            --title "Cardscanner – Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Handy Cardscanner.apk herunterladen und installieren." \
            --target "${{ github.sha }}"
