name: API-Check

# Prüft von Hand, ob die TCGdex-API noch so antwortet, wie die App es erwartet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Live-Tests gegen TCGdex
        env:
          LIVE_API: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests "*LiveApiTest*"
