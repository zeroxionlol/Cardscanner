name: Vorschau

# Rendert die gemalten Typ-Motive als Bilder (zum Ansehen ohne Handy).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Motive rendern
        env:
          PREVIEW: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest --tests "*TypeArtPreviewTest*"
      - uses: actions/upload-artifact@v4
        with:
          name: vorschau
          path: app/build/previews/*.png
